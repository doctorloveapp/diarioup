name: diarioup
description: Agenda Flutter con integrazione locale e isolata verso DidUP.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  cookie_jar: 4.0.9
  crypto: 3.0.7
  dio: 5.11.1
  dio_cookie_manager: 3.5.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.2
  flutter_secure_storage: 11.2.0
  go_router: 17.5.0
  uuid: 4.6.0

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo_diarioup.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/InterVariable.ttf
