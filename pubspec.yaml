name: diarioup
description: Agenda Flutter con integrazione locale e isolata verso DidUP.
publish_to: none
version: 0.1.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  cookie_jar: 4.0.9
  crypto: 3.0.7
  dio: 5.11.1
  dio_cookie_manager: 3.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 11.2.0
  flutter_timezone: 5.1.0
  go_router: 17.5.0
  image: 4.10.1
  image_picker: 1.2.3
  drift: 2.32.0
  path: 1.9.1
  path_provider: 2.1.6
  package_info_plus: 10.2.1
  pdf: 3.12.0
  share_plus: 13.2.1
  sqlite3: 3.5.1
  timezone: 0.11.1
  uuid: 4.6.0

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.32.0
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo_diarioup.png
    - assets/privacy/informativa_privacy.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/InterVariable.ttf

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo_diarioup.png
  min_sdk_android: 28
  remove_alpha_ios: true


