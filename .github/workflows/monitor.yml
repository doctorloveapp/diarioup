name: DidUP Watchdog

on:
  schedule:
    # Esegue alle 06:00 UTC ogni due giorni.
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Ti permette di lanciarlo a mano da GitHub

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Test watchdog rules
        # Validate exclusions and severity rules before sending any report.
        # SMTP secrets are only exposed to the subsequent monitoring step.
        run: python -m unittest scripts.test_monitor_didup

      - name: Run Monitor and send alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USE_STARTTLS: ${{ secrets.SMTP_USE_STARTTLS }}
        run: python scripts/monitor_didup.py --send-email
