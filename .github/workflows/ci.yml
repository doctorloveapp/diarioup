name: DiarioUp CI

on:
  workflow_dispatch:
    inputs:
      run_ios:
        description: Esegui la build iOS senza firma
        required: false
        default: false
        type: boolean
      test_email:
        description: Invia la mail di prova del watchdog
        required: false
        default: false
        type: boolean
      build_apk:
        description: Esegui la build APK debug
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_apk) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  ios-build:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign

  smtp-test:
    if: github.event_name == 'workflow_dispatch' && inputs.test_email
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Invia mail di prova watchdog
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USE_STARTTLS: ${{ secrets.SMTP_USE_STARTTLS }}
        run: python3 scripts/test_email.py
